<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASp Selected Chats Browser</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --panel-3: #0b1220;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --border: rgba(148, 163, 184, 0.25);
        --user: #1d4ed8;
        --assistant: #14532d;
        --shadow: rgba(15, 23, 42, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
      }

      body {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 360px;
        background: rgba(15, 23, 42, 0.9);
        border-right: 1px solid var(--border);
        padding: 16px;
        overflow-y: auto;
      }

      .app-title {
        margin: 0 0 12px;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .status {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(30, 41, 59, 0.8);
        padding: 10px 12px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .chat-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .chat-item {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 12px 10px;
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
        text-align: left;
        color: var(--text);
        width: 100%;
      }

      .chat-item:hover,
      .chat-item.active {
        border-color: rgba(125, 211, 252, 0.85);
        background: rgba(15, 118, 110, 0.12);
        transform: translateY(-1px);
      }

      .chat-item .title {
        font-weight: 700;
        margin: 0 0 6px;
        line-height: 1.35;
      }

      .chat-item .meta {
        color: var(--muted);
        font-size: 0.77rem;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        background: rgba(15, 23, 42, 0.75);
      }

      .detail-card {
        max-width: 1200px;
        margin: 0 auto;
        background: rgba(11, 18, 32, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 40px var(--shadow);
        overflow: hidden;
      }

      .detail-header {
        padding: 20px 22px 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(17, 24, 39, 0.9);
      }

      .detail-header h2 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
      }

      .detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .meta-pill {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.2);
      }

      .transcript {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px 20px 24px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.55);
        padding: 12px 14px;
      }

      .message.user {
        background: rgba(30, 64, 175, 0.18);
        border-left: 4px solid var(--user);
      }

      .message.assistant {
        background: rgba(20, 83, 45, 0.16);
        border-left: 4px solid var(--assistant);
      }

      .message .role {
        font-weight: 700;
        font-size: 0.76rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .message .body {
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 0.96rem;
      }

      .empty {
        color: var(--muted);
        padding: 32px 18px;
        font-size: 1rem;
      }

      @media (max-width: 900px) {
        body { display: block; }
        .sidebar {
          width: 100%;
          max-height: none;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .content { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <h1 class="app-title">CASp Selected Chats</h1>
      <div id="status" class="status">Loading selected chats…</div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="content">
      <div id="detail" class="detail-card">
        <div class="empty">Select a conversation to view the full transcript.</div>
      </div>
    </main>

    <script>
      const state = {
        chats: [],
        selectedIndex: 0
      };

      const chatListEl = document.getElementById('chatList');
      const detailEl = document.getElementById('detail');
      const statusEl = document.getElementById('status');

      function formatDate(ts) {
        if (!ts) return 'Unknown date';
        const dt = new Date(ts * 1000);
        if (Number.isNaN(dt.getTime())) return 'Unknown date';
        return new Intl.DateTimeFormat('en-US', {
          dateStyle: 'medium',
          timeStyle: 'short'
        }).format(dt);
      }

      function normalizeText(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'string') return value.replace(/\u200b/g, '').trim();
        if (Array.isArray(value)) return value.map(normalizeText).filter(Boolean).join('\n\n');
        if (typeof value === 'object') {
          if ('text' in value && typeof value.text === 'string') return value.text.replace(/\u200b/g, '').trim();
          if ('content' in value) return normalizeText(value.content);
          if ('parts' in value) return normalizeText(value.parts);
          if ('value' in value) return normalizeText(value.value);
          return Object.values(value).map(normalizeText).filter(Boolean).join('\n\n');
        }
        return String(value).replace(/\u200b/g, '').trim();
      }

      function extractConversationMessages(conversation) {
        if (!conversation || !conversation.mapping) return [];
        const messages = [];
        Object.values(conversation.mapping).forEach((node) => {
          if (!node || !node.message) return;
          const msg = node.message;
          const role = (msg.author && msg.author.role) ? msg.author.role : 'unknown';
          const content = msg.content;

          let text = '';
          if (typeof content === 'string') {
            text = content;
          } else if (content && typeof content === 'object') {
            if (Array.isArray(content.parts)) {
              text = content.parts.map((part) => {
                if (typeof part === 'string') return part;
                if (part && typeof part === 'object') {
                  if (part.text) return part.text;
                  if (part.content_type === 'audio_transcription' && part.text) return part.text;
                  return '';
                }
                return '';
              }).join('\n\n');
            } else if (content.parts) {
              text = normalizeText(content.parts);
            } else if (content.text) {
              text = content.text;
            }
          }

          const cleaned = normalizeText(text);
          if (cleaned) {
            messages.push({ role, text: cleaned });
          }
        });
        return messages;
      }

      function renderChatList(chats) {
        chatListEl.innerHTML = '';
        chats.forEach((chat, index) => {
          const button = document.createElement('button');
          button.className = 'chat-item' + (index === state.selectedIndex ? ' active' : '');
          button.type = 'button';
          button.innerHTML = `
            <div class="title">${escapeHtml(chat.title || 'Untitled conversation')}</div>
            <div class="meta">${escapeHtml(chat.source_file || '')} • ${escapeHtml(formatDate(chat.create_time))}</div>
          `;
          button.addEventListener('click', () => {
            state.selectedIndex = index;
            renderChatList(chats);
            renderDetail(chat);
          });
          chatListEl.appendChild(button);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderDetail(chat) {
        if (!chat) {
          detailEl.innerHTML = '<div class="empty">No conversation selected.</div>';
          return;
        }

        const messages = extractConversationMessages(chat.conversation);
        const detailHtml = `
          <div class="detail-header">
            <h2>${escapeHtml(chat.title || 'Untitled conversation')}</h2>
            <div class="detail-meta">
              <span class="meta-pill">${escapeHtml(chat.source_file || 'Unknown file')}</span>
              <span class="meta-pill">${escapeHtml(formatDate(chat.create_time))}</span>
              <span class="meta-pill">${messages.length} messages</span>
            </div>
          </div>
          <div class="transcript">
            ${messages.length ? messages.map((msg) => `
              <div class="message ${msg.role === 'user' ? 'user' : 'assistant'}">
                <div class="role">${escapeHtml(msg.role)}</div>
                <div class="body">${escapeHtml(msg.text)}</div>
              </div>
            `).join('') : '<div class="empty">This conversation did not contain extractable text.</div>'}
          </div>
        `;

        detailEl.innerHTML = detailHtml;
      }

      async function loadData() {
        try {
          const response = await fetch('./selected_chats_flat.json', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          state.chats = Array.isArray(data) ? data : [];
          statusEl.textContent = `${state.chats.length} selected chats loaded`;
          if (!state.chats.length) {
            detailEl.innerHTML = '<div class="empty">No chats were found in the selected data file.</div>';
            return;
          }
          renderChatList(state.chats);
          renderDetail(state.chats[0]);
        } catch (error) {
          statusEl.textContent = 'Unable to load local JSON directly; use a local server to view the browser.';
          detailEl.innerHTML = `
            <div class="empty">
              <p>Open this page from a local HTTP server.</p>
              <p>Example:</p>
              <pre style="white-space: pre-wrap; background: rgba(15,23,42,0.8); padding: 12px; border-radius: 8px;">cd "C:\\Users\\shiju\\Desktop\\SynologyDrive\\SynologyDrive\\S+Y Studio\\ShimmyAI\\03 Projects\\Test Bank\\CASp\\Selected Chats"
python -m http.server 8000</pre>
              <p>Then visit:</p>
              <pre style="white-space: pre-wrap; background: rgba(15,23,42,0.8); padding: 12px; border-radius: 8px;">http://localhost:8000/</pre>
            </div>
          `;
        }
      }

      loadData();
    </script>
  </body>
</html>
